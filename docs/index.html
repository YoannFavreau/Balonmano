function ladderTarget(step, vma) {
  if (!vma || step.rsa || !step.pct) return '';
  const ms = vma / 3.6 * step.pct / 100;
  if (step.w && step.w <= 60) return `≈ ${Math.round(ms * step.w)} m par effort de ${step.w}″ (${step.pct} % de ta VMA ${vma} km/h)`;

  return `allure cible ≈ ${Math.floor(pace/60)}′${String(Math.round(pace%60)).padStart(2,'0')}″/km (${step.pct} % VMA)`;
}

const calWeek = (date = today()) => Math.max(1, Math.floor(diffDays(date, ST().settings.startDate) / 7) + 1);

/* Phase d'une semaine : réelle pour le passé/présent, projetée pour le futur (jamais d'avance automatique) */
function phaseOfWeek(w) {
  const h = ST().phase.history, cw = calWeek();
  if (w <= cw) {
    const e = [...h].reverse().find(x => x.startWeek <= w) || h[0];
    return { phase:e.phase, idx: w - e.startWeek + 1, projected:false };
  }
  let p = curPhaseEntry().phase, s = curPhaseEntry().startWeek;
  let end = Math.max(s + 3, cw);
  while (w > end && p < 4) { p++; s = end + 1; end = s + 3; }
  return { phase:p, idx: w - s + 1, projected:true };
}
function weekInfo(w) {

}

}

async function ghSync(reason) {

  if (!navigator.onLine) { setSync('offline'); return; }
  GH.busy = true; setSync('saving');
  try {
    for (let attempt = 0; attempt < 3; attempt++) {
      const remote = await ghFetch();
      const local = snapshot();
      if (GH.cfg.first && remote.exists) local.state = { ...local.state, updatedAt: 0 }; // nouvel appareil : les réglages du dépôt priment
      const merged = mergeData(local, remote.exists ? remote.data : null);

      if (changedLocal) { REAL.state = merged.state; REAL.logs = merged.logs; REAL.checkins = merged.checkins; REAL.active = merged.active; REAL.activeU = merged.activeU; saveLocal(); }
      if (!remote.exists || canon(merged) !== canon(remote.data)) {
        const res = await ghPut({ ...merged, savedAt: Date.now() }, remote.exists ? remote.sha : null);
        if (res.conflict) continue;
      }
      GH.last = Date.now(); GH.err = ''; if (GH.cfg.first) { GH.cfg.first = false; GH.save(GH.cfg); }
      if (changedLocal && !(DB().active && ui.runOpen) && !ui.wiz) render();

}

function niceTicks(lo, hi, int) {
  if (hi === lo) { hi = lo + 1; lo = Math.max(0, lo - 1); }
  const raw = (hi - lo) / 4, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = (int ? [1,2,5,10] : [1,2,2.5,5,10]).map(k => k*mag).find(k => k >= raw) || raw;
  const a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step, t = [];
  for (let v = a; v <= b + 1e-9; v += step) t.push(+v.toFixed(2));
  return t;
}
function drawCharts() {
  document.querySelectorAll('.chart').forEach(el => {
    const c = CHARTS[el.dataset.chart]; if (!c) return;
    const W = el.clientWidth || 320, H = c.h, m = { l:38, r:10, t:10, b:24 };
    const n = c.labels.length; if (!n) { el.innerHTML = ''; return; }
    const pw = W - m.l - m.r, ph = H - m.t - m.b;
    let vals = c.series.flatMap(s => s.values).filter(v => v != null);
    if (c.stacked) vals = c.labels.map((_, i) => c.series.reduce((a, s) => a + (s.values[i] || 0), 0));
    const lo = c.min != null ? c.min : (c.type === 'bar' ? 0 : Math.min(...vals));
    const hi = c.max != null ? c.max : Math.max(...vals, lo + 1);
    const ticks = niceTicks(lo, hi, c.int); const y0 = ticks[0], y1 = ticks[ticks.length-1];
    const Y = v => m.t + (1 - (v - y0) / (y1 - y0)) * ph;
    const band = pw / n, X = i => m.l + band * i + band / 2;
    let s = `<svg width="${W}" height="${H}" role="img" aria-label="${esc(c.title || 'graphique')}">`;
    if (c.zone) s += `<rect x="${m.l}" y="${Y(Math.min(c.zone, y1))}" width="${pw}" height="${Y(y0) - Y(Math.min(c.zone, y1))}" fill="#34c77b" opacity=".07"/>`;
    ticks.forEach(t => s += `<line x1="${m.l}" x2="${W-m.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="#2f343b"/><text x="${m.l-6}" y="${Y(t)+4}" text-anchor="end" font-size="10" fill="#858c96">${t}</text>`);
    const every = Math.max(1, Math.ceil(n / Math.max(1, Math.floor(pw / 46))));
    c.labels.forEach((l, i) => { if (i % every === 0 || i === n-1 && n < 8) s += `<text x="${X(i)}" y="${H-6}" text-anchor="middle" font-size="10" fill="#858c96">${esc(l)}</text>`; });
    if (c.type === 'bar') {
      const gs = c.stacked ? 1 : c.series.length, bw = Math.max(3, Math.min(28, (band * 0.7) / gs));
      c.labels.forEach((_, i) => {
        let acc = 0;
        c.series.forEach((se, k) => {
          const v = se.values[i]; if (!v) return;
          let x, yTop, yBot;
          if (c.stacked) { x = X(i) - bw/2; yBot = Y(y0 + acc); acc += v; yTop = Y(y0 + acc); }
          else { x = X(i) - (bw * gs)/2 + k * bw; yTop = Y(v); yBot = Y(y0); }
          const hgt = Math.max(1, yBot - yTop - (c.stacked && k > 0 ? 2 : 0));
          s += `<rect x="${x + (c.stacked ? 0 : 1)}" y="${yTop}" width="${bw - (c.stacked ? 0 : 2)}" height="${hgt}" rx="3" fill="${se.color}"/>`;
        });
      });
    } else {
      c.series.forEach(se => {
        let d = '', pen = false;
        se.values.forEach((v, i) => { if (v == null) { if (!c.connect) pen = false; return; } d += `${pen ? 'L' : 'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`; pen = true; });
        s += `<path d="${d}" fill="none" stroke="${se.color}" stroke-width="2" ${se.dash ? 'stroke-dasharray="5 4" opacity=".75"' : ''} stroke-linejoin="round" stroke-linecap="round"/>`;
        if (!se.dash && n <= 60) se.values.forEach((v, i) => { if (v != null) s += `<circle cx="${X(i)}" cy="${Y(v)}" r="3.5" fill="${se.color}" stroke="#1b1e23" stroke-width="2"/>`; });

    }

    el.innerHTML = s;
    const tip = el.querySelector('.tip'), xh = el.querySelector('.xh');
    const move = ev => {
      const r = el.getBoundingClientRect(), cx = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
      const i = Math.max(0, Math.min(n-1, Math.floor((cx - m.l) / band)));
      xh.setAttribute('x1', X(i)); xh.setAttribute('x2', X(i)); xh.setAttribute('opacity', 1);
      tip.innerHTML = `<div class="text-txt-3 mb-1">${esc(c.full ? c.full[i] : c.labels[i])}</div>` + c.series.map(se => se.values[i] == null ? '' :
        `<div class="flex items-center gap-2"><span class="w-2 h-2 rounded-full" style="background:${se.color}"></span><span class="text-txt-2">${se.name}</span><b class="ml-auto pl-3">${se.values[i]}${c.unit ? ' ' + c.unit : ''}</b></div>`).join('');
      tip.classList.remove('hidden');

function rangeWeeks(r) {
  const cw = Math.max(1, calWeek()), last = cw;
  if (r === 'last4') return [Math.max(1, last-3), last];
  if (r === 'prev4') return [Math.max(1, last-7), Math.max(1, last-4)];
  if (/^P\d$/.test(r)) { const p = +r[1]; const ws = Array.from({length: Math.max(cw, 16)}, (_, i) => i+1).filter(w => weekInfo(w).phase === p && w <= cw); return ws.length ? [ws[0], ws[ws.length-1]] : null; }

}
const RANGES = [['all','Tout le cycle'],['last4','4 dernières sem.'],['prev4','4 semaines précédentes'],['P1','Phase 1'],['P2','Phase 2'],['P3','Phase 3'],['P4','Phase 4']];
function periodKpis(r) {
  const rg = rangeWeeks(r); if (!rg) return null;
  const ws = []; for (let w = rg[0]; w <= rg[1]; w++) ws.push(weekStats(w));
  const n = ws.length || 1;
  return { label: RANGES.find(x => x[0] === r)[1] + ` (S${rg[0]}–S${rg[1]})`, sessions: ws.reduce((a,x)=>a+x.sessions,0), load: Math.round(ws.reduce((a,x)=>a+x.load,0)/n),
    km: round1(ws.reduce((a,x)=>a+x.km,0)/n), tonnage: Math.round(ws.reduce((a,x)=>a+x.tonnage,0)/n), rpe: round1(avg(ws.map(x=>x.rpe).filter(v=>v!=null))),
    fatigue: round1(avg(ws.map(x=>x.fatigue).filter(v=>v!=null))), painCalf: round1(avg(ws.map(x=>x.painCalf).filter(v=>v!=null))), painSh: round1(avg(ws.map(x=>x.painSh).filter(v=>v!=null))), coll: Math.round(ws.reduce((a,x)=>a+x.collMin,0)/n) };
}

function daysWarning() {
  const d = ST().settings.days, calf = ['A','B','D'].map(k => d[k]).sort((a,b) => a-b), bad = [];
  for (let i = 0; i < calf.length; i++) for (let j = i+1; j < calf.length; j++) { const g = Math.min(Math.abs(calf[i]-calf[j]), 7 - Math.abs(calf[i]-calf[j])); if (g <= 1) bad.push([calf[i], calf[j]]); }
  return bad.length ? `<p class="text-sm text-warn mt-2">⚠ Séances exigeantes pour les mollets à moins de 48 h : ${bad.map(([a,b]) => `${DAYS[a]} / ${DAYS[b]}`).join(', ')}. Espace A, B et D d’au moins un jour.</p>` : `<p class="text-xs text-good mt-2">✓ A, B et D sont espacées d’au moins 48 h.</p>`;
}

    const rec = DB().logs.filter(l => [1,2].includes(diffDays(t, l.date))).map(l => `${(l.key === "X" ? logTitle(l) : SESSIONS[l.key].short)} (${diffDays(t, l.date) === 1 ? '24 h' : '48 h'})`);
    out.push({ type:'ci', prio:1, title:'Suivi du matin', sub: rec.length ? `Sert aussi de contrôle après : ${rec.join(', ')}` : 'Mollets, épaule, récupération, montre · 1 min', icon:'☀' });
  }
  [cw-1, cw].filter(w => w >= 1).forEach(w => weekSlots(w).forEach(s => {
    if (s.status === 'missed' && st.slotStatus[s.id] !== 'missed' && diffDays(t, s.date) <= 10)
      out.push({ type:'slot', prio:2, id:s.id, title:`As-tu fait la séance ${s.key} ?`, sub:`${s.meta.name} · prévue ${fmtD(s.date)}`, icon:s.meta.icon });
  }));
  st.events.filter(e => e.type === 'collectif' && e.date <= t && !e.asked && (!e.done || !e.rpe)).forEach(e =>
    out.push({ type:'coll', prio:3, id:e.id, title:'Entraînement collectif', sub:`${fmtD(e.date)} · durée et effort à renseigner`, icon:'🤾' }));
  const props = allProposals().sort((a, b) => (a.action === 'down' ? 0 : 1) - (b.action === 'down' ? 0 : 1));
  if (props.length) out.push({ type:'props', prio:4, props, title: props.length === 1 ? 'Un ajustement de charge proposé' : `${props.length} ajustements de charge proposés`, sub:'Tu décides : accepter ou maintenir le palier', icon:'⇅' });
  const wi = weekInfo(cw), b = st.bilans[wi.phase];
  if (wi.bilan && !(b && b.date)) out.push({ type:'bilan', prio:5, title: wi.phase === 2 ? 'Évaluation avant reprise collective' : 'Bilan fonctionnel de fin de phase', sub:'À réaliser cette semaine, idéalement avec ton kiné', icon:'🩺' });
  return out.sort((a,b) => a.prio - b.prio);
}

  if (el.dataset.bilan) { st.bilans[el.dataset.p] = st.bilans[el.dataset.p] || { results:{} }; st.bilans[el.dataset.p][el.dataset.bilan] = el.value; persist(); return; }
  if (el.dataset.test) { const b = st.bilans[el.dataset.p] = st.bilans[el.dataset.p] || { results:{} }; b.results = b.results || {}; b.results[el.dataset.v] = { ...(b.results[el.dataset.v]||{}), [el.dataset.test]: el.value === '' ? null : +el.value }; persist(); rer(); return; }
  if (el.dataset.it) { const arr = ensureCustom(ui.progPhase, ui.progKey), f = +el.dataset.it; arr[+el.dataset.v][f] = f === 4 ? el.value : +el.value; persist(); rer(); return; }
  if (el.dataset.exo) { const id = el.dataset.v, f = el.dataset.exo; st.exo[id] = { ...(st.exo[id]||{}), [f]: f === 'rule' ? el.value : +el.value }; persist(); toast('Réglage enregistré'); return; }
  if (el.dataset.lvl) { st.levels[el.dataset.lvl] = +el.value; persist(); return; }
  if (el.dataset.run || (el.dataset.set && el.dataset.i != null)) { persist('active'); }
});
window.addEventListener('resize', () => { clearTimeout(window._rz); window._rz = setTimeout(drawCharts, 150); });

/* Chronomètres de séance */
setInterval(() => {
  const a = act(); if (!a || !ui.runOpen) return;
  const el = document.getElementById('elapsed'); if (el) el.textContent = mmss(runElapsed(a));
  if (a.restUntil) {
    const r = document.getElementById('rest');
    if (a.restUntil <= Date.now()) { a.restUntil = null; try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {} render(); toast('Repos terminé : série suivante'); }
    else if (r) r.textContent = mmss(a.restUntil - Date.now());
  }
}, 1000);

/* =====================================================================
   DÉMO (données fictives, jamais enregistrées)
   ===================================================================== */
function makeDemo() {
  const saved = DEMO; const s = freshState();
  s.onboarded = true; s.settings.startDate = addDays(mondayOf(today()), -35); s.createdAt = s.settings.startDate;
  s.profile.vma = 16;
  s.phase.history.push({ phase:2, startWeek:5, validatedAt: addDays(s.settings.startDate, 27), comment:'[DÉMO] validé avec le kiné' });
  s.criteria[1].forEach(c => { c.status = 'ok'; c.date = addDays(s.settings.startDate, 27); c.comment = '[DÉMO]'; });
  s.criteria[2][0].status = 'reeval'; s.criteria[2][2].status = 'ok';
  s.bilans[1] = { date: addDays(s.settings.startDate, 26), comment:'[DÉMO] valeurs fictives', results:{ calfraise:{ L:24, R:21 }, kneewall:{ L:11, R:10 }, balance:{ L:22, R:17 }, stab:{ L:7 } } };
  DEMO = { state:s, logs:[], checkins:{}, active:null };
  const cw = calWeek();
  // suivi quotidien
  for (let d = 0; d <= diffDays(addDays(today(), -1), s.settings.startDate); d++) {
    const date = addDays(s.settings.startDate, d), wk = Math.floor(d/7);
    const spike = d === 16 ? 3 : d === 17 ? 2 : 0;
    DEMO.checkins[date] = { calfL:{ pain: d % 5 === 0 ? 1 : 0, stiff: 1 + (d % 3 === 0 ? 1 : 0), sens:'normale', tolRun:'bonne', tolJump: wk < 2 ? 'nt' : 'bonne', tolStr:'bonne' },
      calfR:{ pain: Math.max(spike, wk < 2 ? 2 : 1), stiff: spike ? 4 : wk < 2 ? 3 : 2, sens: spike ? 'tension' : 'normale', tolRun: spike ? 'moyenne' : 'bonne', tolJump: wk < 2 ? 'nt' : 'moyenne', tolStr:'bonne' },
      shoulder:{ stab: 7 + (wk > 2 ? 1 : 0), pain: d % 6 === 0 ? 2 : 1, fatigue: 2 + (d % 4 === 0 ? 2 : 0), tolStr:'bonne', prev: d % 2 ? 'oui' : 'non' },
      gen:{ sleep: 6 + (d % 3), sleepH: 7 + (d % 3) * 0.5, fatigue: 3 + (d % 4 === 1 ? 3 : 0), motiv: 8, recov: 7, rhr: 52 + (d % 4 === 1 ? 4 : d % 3), hrv: 68 - (d % 4 === 1 ? 9 : d % 3 * 2), sleepScore: 72 + (d % 5) * 3, bb: 65 + (d % 4) * 6 } };
  }
  // séances
  const prog = { squat:50, rdl:50, split:10, legcurl:30, calf_straight:20, calf_bent:30, row:22, bench:18, pulldown:45, facepull:15, landmine:15 };
  for (let w = 1; w < cw; w++) ['A','B','C','D'].forEach(k => {
    const sl = slot(w, k); if (sl.date >= today()) return;
    if (w === 3 && k === 'C') return; // séance non effectuée
    const wi = sl.info, plan = slotPlan(sl), ex = {};
    plan.forEach(p => {
      const e = p.ex; let sets;
      const load = !e.repsProg && e.kind === 'strength' ? round1(prog[p.id] != null ? prog[p.id] + (e.step||2) * Math.floor((w-1)/2) : p.load) : null;
      if (e.kind === 'strength' || e.kind === 'time') sets = Array.from({length:p.sets}, () => ({ reps:p.reps, load, done:true }));
      else if (e.kind === 'ladder') sets = Array.from({length:p.ladder.blocks}, () => ({ done:true }));
      else if (e.kind === 'level') sets = p.drills.map(() => ({ done:true }));
      else sets = [{ done:true }];
      const partial = w === 3 && k === 'B' && e.kind === 'ladder';
      if (partial) sets[sets.length-1].done = false;
      ex[p.id] = { pres:{ sets:p.sets, reps:p.reps, load, rpe:p.rpe, rest:p.rest, text:p.text, level:p.level, step:p.step }, sets, rpe: Math.max(1, p.rpe - (w % 2)), tech: e.inj && w < 2 ? 2 : 1, pain: partial ? { zone:'calfR', level:3 } : null, comment: partial ? '[DÉMO] tiraillement mollet droit, dernier bloc arrêté' : '',
        stopped: partial, km: e.run ? round1(p.ladder.km * (partial ? 0.8 : 1)) : null, min: e.run ? p.ladder.min : null, touched:true };
    });
    const status = w === 3 && k === 'B' ? 'incomplete' : 'done', dur = { A:65, B:45, C:55, D:60 }[k], rpe = { A:7, B:8, C:6, D:7 }[k];
    let ton = 0; Object.entries(ex).forEach(([id, x]) => { if (EX[id].kind === 'strength' && !EX[id].repsProg) x.sets.forEach(q => { if (q.done) ton += q.load * q.reps; }); });
    DEMO.logs.push({ id: uid(), slot: sl.id, w, key:k, phase: wi.phase, date: sl.date, start: D8(sl.date).getTime(), end: D8(sl.date).getTime() + dur*60000, durMin: dur, status, rpe, sens: status === 'incomplete' ? 'tensions' : 'normales', pains:{ calfL:0, calfR: status === 'incomplete' ? 3 : 1, shoulder:1 }, comment:'[DÉMO]', tonnage: Math.round(ton), ex });
    if (k === 'B' || k === 'D') s.levels[k === 'B' ? 'court' : 'long'] = Math.min(w < 3 ? w - 1 : w - 2, 5);
  });
  Object.entries(prog).forEach(([id, v]) => { s.exo[id] = { load: round1(v + (EX[id].step||2) * Math.floor((cw-2)/2)) }; });
  s.levels.proprio = 3; s.levels.appuis = 2; s.levels.agilite = 3;
  const out = DEMO; DEMO = saved; return out;
}

/* Glisser-déposer des séances dans le calendrier */
document.addEventListener('dragstart', e => { const el = e.target.closest && e.target.closest('[data-drag]'); if (!el) return; e.dataTransfer.setData('text/plain', el.dataset.drag); e.dataTransfer.effectAllowed = 'move'; });
document.addEventListener('dragover', e => { const z = e.target.closest && e.target.closest('[data-drop]'); if (!z) return; e.preventDefault(); document.querySelectorAll('[data-drop].drop-on').forEach(x => x !== z && x.classList.remove('drop-on')); z.classList.add('drop-on'); });
document.addEventListener('dragleave', e => { const z = e.target.closest && e.target.closest('[data-drop]'); if (z && !z.contains(e.relatedTarget)) z.classList.remove('drop-on'); });
document.addEventListener('drop', e => {
  const z = e.target.closest && e.target.closest('[data-drop]'); if (!z) return; e.preventDefault(); z.classList.remove('drop-on');
  const id = e.dataTransfer.getData('text/plain'), p = parseSlot(id); if (!p) return;
  const s = slot(p.w, p.key), d = z.dataset.drop, st = ST(); if (d === s.date) return;
  if (d === s.planned) delete st.moves[id]; else st.moves[id] = { date:d };
  if (st.slotStatus[id] === 'missed') delete st.slotStatus[id];
  persist(); const cf = s.meta.calf ? calfEventsAround(d, id).filter(x => x.calf) : [];
  toast(cf.length ? `⚠ ${s.meta.name} déplacée au ${fmtD(d)}, mais proche de : ${cf.map(x => x.label).join(', ')}` : `✓ ${s.meta.name} déplacée au ${fmtD(d)}`, cf.length ? 'warn' : ''); rer();
});
